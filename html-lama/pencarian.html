<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="img/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Pencarian - Proyek Manajemen Komunitas Olahraga</title>
  <link href="/src/style.css" rel="stylesheet" />
  <script src="./assets/js/tailwindcss.js"></script>
</head>

<body class="bg-[#F8F9F4] lg:bg-[#111827] flex justify-center min-h-dvh">

  <!-- Container utama -->
  <div class="w-full lg:max-w-4xl min-h-dvh bg-[#F8F9F4] flex flex-col relative lg:shadow-2xl font-sans">

    <!-- Header Search Bar -->
    <header class="sticky top-0 z-20 bg-[#F8F9F4]/95 backdrop-blur-sm px-4 pt-5 pb-4 sm:px-8 sm:pt-7 md:px-12 flex items-center gap-3">
      <a href="/index.html" aria-label="Kembali"
        class="p-1.5 -ml-1.5 text-[#162536] hover:bg-black/5 rounded-full transition cursor-pointer shrink-0">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </a>

      <div class="relative flex-1 flex items-center">
        <svg class="w-[18px] h-[18px] text-[#7A828A] absolute left-3.5 pointer-events-none" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>

        <input
          id="search-input"
          type="text"
          placeholder="Cari acara atau lokasi..."
          autocomplete="off"
          class="w-full h-[38px] sm:h-[42px] pl-10 pr-9 rounded-[11px] bg-[#E5E6E3] text-[#162536] placeholder-[#7A828A] text-[15px] focus:outline-none focus:ring-2 focus:ring-[#22364A]/20 transition"
        />

        <button
          type="button"
          id="clear-btn"
          aria-label="Hapus pencarian"
          class="hidden absolute right-2.5 w-[18px] h-[18px] rounded-full bg-[#8E8E93] text-white flex items-center justify-center hover:bg-[#6E6E73] transition cursor-pointer"
        >
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
            stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <button
        type="button"
        id="cancel-btn"
        class="text-[#007AFF] text-[16px] font-normal hover:opacity-75 active:opacity-50 transition cursor-pointer shrink-0 pl-0.5"
      >
        Cancel
      </button>
    </header>

    <!-- Area Daftar Kartu -->
    <main class="flex-1 px-4 pt-2 pb-10 sm:px-8 md:px-12">
      <div id="event-results" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5"></div>
    </main>

    <!-- BOTTOM SHEET / MODAL DETAIL ACARA -->
    <div id="event-modal" class="fixed inset-0 z-40 hidden flex items-end md:items-center justify-center">
      <div id="modal-backdrop" class="fixed inset-0 bg-black/55 transition-opacity"></div>

      <div
        class="relative z-10 w-full md:max-w-lg bg-[#F8F9F4] rounded-t-[28px] md:rounded-[28px] px-6 pt-6 pb-8 sm:px-8 sm:pt-7 sm:pb-9 shadow-2xl max-h-[88dvh] overflow-y-auto">
        
        <!-- Header Sheet -->
        <div class="relative flex items-center justify-center pb-6">
          <button
            type="button"
            id="close-modal-btn"
            aria-label="Tutup detail"
            class="absolute left-0 p-1.5 -ml-1.5 text-black hover:bg-black/5 rounded-full transition cursor-pointer"
          >
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>

          <span id="modal-datetime" class="text-[15px] sm:text-base font-medium text-[#1E293B] tracking-wide uppercase">
            JUMAT, NOV 20 @16:00
          </span>
        </div>

        <!-- Bagian Host -->
        <section>
          <h3 class="text-lg sm:text-xl font-bold text-black">Host</h3>
          <div id="modal-hosts" class="mt-3.5 flex items-center gap-4 flex-wrap"></div>
        </section>

        <!-- Bagian Hari & Alamat Lengkap -->
        <section class="mt-7 space-y-5">
          <div class="flex items-center gap-4">
            <svg class="w-6 h-6 text-[#22364A] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
              <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" />
            </svg>
            <span id="modal-day" class="text-[15px] sm:text-base font-bold text-[#111827]">Kamis</span>
          </div>

          <div class="flex items-start gap-4">
            <svg class="w-6 h-6 text-[#22364A] shrink-0 mt-0.5" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" />
            </svg>
            <p id="modal-address" class="text-[15px] sm:text-base font-bold text-[#111827] leading-snug">
              Jl. Candi Borobudur No.2, Medan Petisah, Sumatera Utara, Indonesia
            </p>
          </div>
        </section>

        <!-- Bagian Peserta -->
        <section class="mt-9">
          <h3 class="text-lg sm:text-xl font-bold text-black">Peserta</h3>
          <div id="modal-participants" class="mt-3.5 flex items-center gap-4 flex-wrap"></div>
        </section>

        <!-- Tombol Minta Bergabung -->
        <div class="mt-9">
          <button
            type="button"
            id="join-event-btn"
            class="w-full py-3.5 sm:py-4 px-6 rounded-[14px] bg-[#F46A25] hover:bg-[#e25d1b] text-white font-bold text-base sm:text-lg shadow-lg shadow-[#F46A25]/30 active:scale-[0.99] transition cursor-pointer"
          >
            Minta Bergabung
          </button>
        </div>

      </div>
    </div>

    <!-- POP-UP KONFIRMASI PERMINTAAN DIPROSES -->
    <div id="success-popup" class="fixed inset-0 z-50 hidden flex items-center justify-center px-5">
      <div class="fixed inset-0 bg-black/60 backdrop-blur-[1px]"></div>

      <div class="relative z-10 w-full max-w-xs sm:max-w-sm bg-white rounded-[24px] p-6 sm:p-7 text-center shadow-2xl">
        <!-- Ikon Centang -->
        <div class="w-16 h-16 mx-auto rounded-full bg-[#C4F135] text-[#162536] flex items-center justify-center shadow-sm">
          <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>

        <h3 class="mt-4 text-lg sm:text-xl font-bold text-[#162536]">
          Permintaan Terkirim
        </h3>
        <p class="mt-1.5 text-sm sm:text-base text-[#475569] leading-relaxed">
          Permintaan Anda akan diproses. Mengalihkan ke halaman utama...
        </p>

        <button
          type="button"
          id="confirm-redirect-btn"
          class="mt-6 w-full py-3 px-5 rounded-xl bg-[#22364A] hover:bg-[#162536] text-white font-semibold text-sm sm:text-base transition cursor-pointer"
        >
          Oke
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
